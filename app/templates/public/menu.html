{% extends "base.html" %}
{% block title %}Cardápio{% endblock %}
{% block content %}
<h1>Cardápio</h1>
<div class="products">
{% for product in products %}
    <article class="product">
        <img src="{{ url_for('static', filename='images/' + product.image_filename) }}"
             alt="{{ product.name|e }}">
        <h2>{{ product.name|e }}</h2>
        <p>{{ product.description|e }}</p>
        <strong>R$ {{ "%.2f"|format(product.price|float) }}</strong>
    </article>
{% else %}
    <p>Nenhum produto disponível.</p>
{% endfor %}
</div>
{% endblock %}
